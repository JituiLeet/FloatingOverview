name: Build Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: 'latest'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.SIGNING_KEY }}" | base64 -d -i > $GITHUB_WORKSPACE/release.p12
          echo "SIGNING_KEY_PATH=$GITHUB_WORKSPACE/release.p12" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-overview-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
